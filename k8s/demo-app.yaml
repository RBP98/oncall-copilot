apiVersion: v1
kind: Namespace
metadata:
  name: oncall
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: oncall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: demo-app:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: oncall
  labels:
    app: demo-app
spec:
  selector:
    app: demo-app
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-app
  namespace: oncall
  labels:
    release: monitoring   # must match prometheus serviceMonitorSelector label 
spec:
  selector:
    matchLabels:
      app: demo-app
  namespaceSelector:
    matchNames:
      - oncall
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
